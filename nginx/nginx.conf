# "calculator" is the Compose service name. Docker's DNS resolves it to the IPs
# of all replicas, and Nginx distributes requests between them (round-robin).
upstream calculator_backend {
    server calculator:8080;
}

server {
    listen 80;

    location / {
        proxy_pass http://calculator_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Shows which replica handled the request (useful to demonstrate load balancing)
        add_header X-Upstream $upstream_addr always;
    }
}
